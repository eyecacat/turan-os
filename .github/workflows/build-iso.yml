name: TURAN-OS ISO derle

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Araçları kur
        run: |
          apt-get update
          apt-get install -y python3 live-build debootstrap squashfs-tools xorriso git ca-certificates librsvg2-bin

      - uses: actions/checkout@v4

      - name: Betik sözdizimi denetimi
        run: |
          bash -n config/includes.chroot/usr/local/bin/turan
          bash -n config/includes.chroot/usr/local/bin/turan-ilk-oturum
          bash -n config/includes.chroot/usr/local/bin/turan-fs-tune
          bash -n config/includes.chroot/usr/local/bin/turan-bakim
          bash -n config/includes.chroot/usr/local/bin/turan-karsilama
          bash -n config/includes.chroot/usr/local/bin/turan-ek
          python3 -m py_compile config/includes.chroot/usr/local/bin/sanyrak
          bash -n config/includes.chroot/usr/local/bin/bilge
          bash -n config/includes.chroot/usr/local/bin/bilge-sohbet
          bash -n config/includes.chroot/usr/local/bin/bilge-ajan
          bash -n config/includes.chroot/usr/local/bin/tamga-gpg
          bash -n config/includes.chroot/usr/local/bin/bozkir-tuval
          for f in auto/config config/hooks/live/*.hook.chroot; do sh -n "$f"; done

      - name: ISO derle
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          chmod +x auto/config
          lb config
          lb build

      - name: ISO'yu hazırla ve denetle
        run: |
          SURUM="$(cat config/includes.chroot/etc/turan-surum)"
          mv live-image-*.iso "turan-os-${SURUM}-amd64.iso"
          sha256sum "turan-os-${SURUM}-amd64.iso" > SHA256SUMS
          ls -lh turan-os-*.iso
          xorriso -indev "turan-os-${SURUM}-amd64.iso" -report_el_torito plain

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: turan-os-iso
          path: |
            turan-os-*.iso
            SHA256SUMS
          compression-level: 0

      - name: Sürüm için parçala (GitHub dosya sınırı 2 GiB)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          split -b 1900M -d -a 2 turan-os-*-amd64.iso "turan-os-${GITHUB_REF_NAME}-amd64.iso.part"

      - name: GitHub Releases'e yükle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            turan-os-*.iso.part*
            SHA256SUMS
          body: |
            İndirdiğiniz parçaları birleştirin.
            Linux/macOS: `cat turan-os-*.iso.part* > turan-os.iso`
            Windows (cmd): `copy /b turan-os-*.iso.part00 + turan-os-*.iso.part01 + turan-os-*.iso.part02 turan-os.iso`
            Doğrulama için SHA256SUMS dosyasına bakın.
