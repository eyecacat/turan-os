---
modules-search: [ local, /usr/lib/calamares/modules ]
instances:
  - id:       turan
    module:   welcome
    config:   welcome.conf
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - luksbootkeyfile
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - bootloader-config
    - grubcfg
    - bootloader
    - packages
    - luksopenswaphookcfg
    - initcpiocfg
    - initramfs
    - umount
  - show:
    - finished
branding: turan
prompt-install: false
dont-chroot: false
